<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EcoDash African Logistics</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div id="gameWrapper">
 
        <!-- HUD: sits above the canvas, separate from the game area -->
        <header id="hud">
            <div id="hudBrand">EcoDash <small>African Logistics</small></div>
 
            <div id="hudStats">
                <div class="stat"><span class="label">Score</span><span id="score">0</span></div>
                <div class="stat"><span class="label">Distance</span><span id="distance">0.0 km</span></div>
                <div class="stat"><span class="label">Weather</span><span id="weather">CLEAR</span></div>
                <div class="stat"><span class="label">Time</span><span id="clock">06:00 Morning</span></div>
            </div>
 
            <div id="battery">
                <span class="label">Battery</span>
                <div id="batteryBar"><div id="batteryFill"></div></div>
                <span id="batteryText">100%</span>
            </div>
        </header>

    <canvas></canvas>

    <!-- Objective and keyboard controls underneath the game area -->
        <footer id="bottomBar">
            <div id="objective">Objective: Deliver Supplies <span id="deliveryCount">(0 / 0)</span></div>
 
            <div id="controls">
                <h2>Controls</h2>
                <ul>
                    <li><kbd>W</kbd> / <kbd>&uarr;</kbd> Accelerate</li>
                    <li><kbd>S</kbd> / <kbd>&darr;</kbd> Reverse</li>
                    <li><kbd>A</kbd> / <kbd>&larr;</kbd> Steer left</li>
                    <li><kbd>D</kbd> / <kbd>&rarr;</kbd> Steer right</li>
                    <li><kbd>H</kbd> Horn</li>
                    <li><kbd>P</kbd> Pause</li>
                    <li><kbd>R</kbd> Restart</li>
                </ul>
            </div>
        </footer>
    </div>
 
    <script src="script.js"></script>
</body>
</html>
